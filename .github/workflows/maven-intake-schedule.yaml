name: Maven intake (schemalagt)

# Letar efter releaser i organisationen som har en maven-staging.tar.gz och
# kör maven-intake.yaml för var och en. Körs var 15:e minut under kontorstid,
# både av schemat nedan och av maven-intake-heartbeat.yaml. Varje körning
# fortsätter där senaste lyckade körning skapades, så releaser tas in även om
# GitHub hoppar över körningar, och releaser från kvällar och helger tas in
# vid första körningen nästa vardag. Intaget hoppar över versioner som redan
# finns, så det gör inget om samma release ses i flera körningar.
#
# Bara repon vars namn matchar REPO_FILTER blir källor. Utöka filtret när nya
# team ansluts. På sikt ersätts det av custom propertyn "team" och av
# verifiering av attesteringar.
#
# Workflowet har inga inputs. Om varje körning täcker hela tiden sedan förra
# lyckade körning blir den alltid en säker startpunkt. Releaser som ligger före
# startpunkten, till exempel när ett nytt repo läggs till i REPO_FILTER, tas in
# genom att köra maven-intake.yaml direkt med repo och tagg.
#
# Obs: GitHub stänger av schemalagda workflows efter 60 dagar utan aktivitet i
# repot. Starta workflowet manuellt eller gör en commit om det har stängts av.

on:
  schedule:
    # Var 15:e minut 07:07–17:52 svensk tid, vardagar.
    - cron: "7,22,37,52 7-17 * * 1-5"
      timezone: "Europe/Stockholm"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maven-intake-schedule
  cancel-in-progress: false

jobs:
  find:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      releases: ${{ steps.find.outputs.releases }}
      count: ${{ steps.find.outputs.count }}
    steps:
      - name: Find new releases with Maven staging
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: Forsakringskassan
          REPO_FILTER: "^rimfrost-"
          # Marginal bakåt från förra lyckade körningens skapande, och tak för hur
          # långt bakåt vi går.
          MARGIN_MINUTES: "15"
          MAX_HOURS: "336"
        run: |
          now="$(date -u +%s)"
          max_cutoff=$(( now - MAX_HOURS * 3600 ))

          # Fortsätt där senaste lyckade körning skapades. Alla körningar täcker
          # hela tiden sedan dess, så den är alltid en säker startpunkt.
          last="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/maven-intake-schedule.yaml/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].created_at // empty')"
          if [ -n "$last" ]; then
            cutoff_s=$(( $(date -u -d "$last" +%s) - MARGIN_MINUTES * 60 ))
            echo "Senaste lyckade körning skapades $last"
          else
            echo "::warning::Ingen tidigare lyckad körning, går tillbaka $MAX_HOURS timmar"
            cutoff_s=$max_cutoff
          fi

          if [ "$cutoff_s" -lt "$max_cutoff" ]; then
            echo "::warning::Fönstret är längre än $MAX_HOURS timmar, begränsar. Kontrollera om intaget har fallerat länge."
            cutoff_s=$max_cutoff
          fi

          cutoff="$(date -u -d "@$cutoff_s" +%Y-%m-%dT%H:%M:%SZ)"
          echo "Letar efter releaser publicerade efter $cutoff"

          # En GraphQL-fråga per 50 repon, i stället för ett anrop per repo.
          # $owner, $endCursor och $repo är variabler i GraphQL och jq, inte i
          # skalet, och ska inte expanderas.
          # shellcheck disable=SC2016
          gh api graphql --paginate -F owner="$OWNER" -f query='
            query($owner: String!, $endCursor: String) {
              rateLimit { cost remaining resetAt }
              organization(login: $owner) {
                repositories(first: 50, after: $endCursor) {
                  pageInfo { hasNextPage endCursor }
                  nodes {
                    name
                    isArchived
                    releases(first: 20, orderBy: {field: CREATED_AT, direction: DESC}) {
                      nodes {
                        tagName
                        publishedAt
                        isDraft
                        releaseAssets(first: 20) { nodes { name } }
                      }
                    }
                  }
                }
              }
            }' > "$RUNNER_TEMP/pages.json"

          # Kostnad per sida och kvarvarande budget, för att se om frågan
          # närmar sig gränsen.
          # shellcheck disable=SC2016
          jq -r '.data.rateLimit | "GraphQL-sida: kostnad \(.cost), kvar \(.remaining), nollställs \(.resetAt)"' \
            "$RUNNER_TEMP/pages.json"
          jq -s -r '"GraphQL totalt: \(map(.data.rateLimit.cost) | add) poäng, kvar \(last.data.rateLimit.remaining)"' \
            "$RUNNER_TEMP/pages.json"

          # shellcheck disable=SC2016
          jq -r '
            .data.organization.repositories.nodes[]
            | select(.isArchived | not)
            | .name as $repo
            | .releases.nodes[]
            | select((.isDraft | not) and .publishedAt != null)
            | select([.releaseAssets.nodes[].name] | index("maven-staging.tar.gz"))
            | [$repo, .tagName, .publishedAt] | @tsv' \
            "$RUNNER_TEMP/pages.json" > "$RUNNER_TEMP/candidates.tsv"

          # Bara tillåtna repon, och bara releaser efter gränsen.
          # ISO 8601-tider i UTC går att jämföra som text.
          echo "Tillåtna repon: $REPO_FILTER"
          awk -F'\t' -v c="$cutoff" -v re="$REPO_FILTER" '$1 ~ re && $3 > c { print $1 "\t" $2 }' \
            "$RUNNER_TEMP/candidates.tsv" > "$RUNNER_TEMP/new.tsv"
          ignored="$(awk -F'\t' -v c="$cutoff" -v re="$REPO_FILTER" '$1 !~ re && $3 > c { print $1 "\t" $2 }' "$RUNNER_TEMP/candidates.tsv")"
          if [ -n "$ignored" ]; then
            echo "::warning::Releaser med maven-staging i repon utanför filtret ignoreras:"
            echo "$ignored"
          fi

          count="$(wc -l < "$RUNNER_TEMP/new.tsv" | tr -d ' ')"
          releases="$(jq -R -s -c 'split("\n") | map(select(length > 0) | split("\t") | {repo: .[0], tag: .[1]})' "$RUNNER_TEMP/new.tsv")"

          echo "Hittade $count release(r):"
          cat "$RUNNER_TEMP/new.tsv"
          {
            echo "count=$count"
            echo "releases=$releases"
          } >> "$GITHUB_OUTPUT"

  intake:
    needs: find
    if: needs.find.outputs.count != '0'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.find.outputs.releases) }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/maven-intake.yaml
    with:
      repo: ${{ matrix.repo }}
      tag: ${{ matrix.tag }}
