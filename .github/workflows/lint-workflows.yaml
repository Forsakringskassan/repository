name: Lint workflows

# Kontrollerar workflow-filer med actionlint (och med shellcheck för run-blocken)
# på varje PR som ändrar dem. Fel visas som anteckningar direkt i PR:ens diff.

on:
  pull_request:
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: "1.7.7"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          go version
          GOBIN="$RUNNER_TEMP/bin" go install "github.com/rhysd/actionlint/cmd/actionlint@v${ACTIONLINT_VERSION}"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Run actionlint
        run: |
          shellcheck --version
          # $err är en variabel i actionlints Go-template, inte i skalet, och ska inte expanderas.
          # shellcheck disable=SC2016
          actionlint -format '{{range $err := .}}::error file={{$err.Filepath}},line={{$err.Line}},col={{$err.Column}}::{{$err.Message}}\n{{end}}'
